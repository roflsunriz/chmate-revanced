name: Release

on:
  push:
    tags:
      - "v[0-9]*.[0-9]*.[0-9]*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and verify patch bundle
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    outputs:
      version: ${{ steps.metadata.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Validate version and tag
        id: metadata
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version=//p' gradle.properties)"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "gradle.properties has an invalid release version: $version" >&2
            exit 1
          fi
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match gradle.properties version $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Test, lint, and build
        env:
          ORG_GRADLE_PROJECT_githubPackagesUsername: ${{ github.actor }}
          ORG_GRADLE_PROJECT_githubPackagesPassword: ${{ secrets.REVANCED_PACKAGES_TOKEN || github.token }}
        run: >-
          ./gradlew --no-daemon clean
          :patches:test
          :extensions:chmate:test
          :extensions:chmate:lint
          :patches:buildAndroid

      - name: Package release assets
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.metadata.outputs.version }}"
          bundle="patches/build/libs/patches-$version.rvp"
          test -f "$bundle"
          unzip -tqq "$bundle"
          jar tf "$bundle" > bundle-contents.txt
          grep -Fxq 'META-INF/MANIFEST.MF' bundle-contents.txt
          grep -Fxq 'io/github/chmate/revanced/ChMatePatchKt.class' bundle-contents.txt
          grep -Fxq 'extensions/chmate.rve' bundle-contents.txt
          if grep -Eiq '\.(apk|xapk)$' bundle-contents.txt; then
            echo 'Patch bundle must not contain ChMate APK or XAPK files' >&2
            exit 1
          fi
          mkdir release-assets
          cp "$bundle" release-assets/
          cd release-assets
          sha256sum "patches-$version.rvp" > "patches-$version.rvp.sha256"
          sha256sum --check "patches-$version.rvp.sha256"

      - name: Upload verified assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: patches-${{ steps.metadata.outputs.version }}
          path: release-assets/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout release notes
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download verified assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: patches-${{ needs.build.outputs.version }}
          path: release-assets

      - name: Verify downloaded assets
        working-directory: release-assets
        run: sha256sum --check "patches-${{ needs.build.outputs.version }}.rvp.sha256"

      - name: Prepare release notes
        shell: bash
        run: |
          set -euo pipefail
          version="${{ needs.build.outputs.version }}"
          source="docs/release-notes/v$version.md"
          test -f "$source"
          cp "$source" release-notes.md
          {
            printf '\n## 配布物の SHA-256\n\n```text\n'
            cat "release-assets/patches-$version.rvp.sha256"
            printf '```\n'
          } >> release-notes.md

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version="${{ needs.build.outputs.version }}"
          tag="v$version"
          bundle="release-assets/patches-$version.rvp"
          checksum="$bundle.sha256"
          manifest="release-assets/patches.json"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$bundle" "$checksum" --clobber
            gh release edit "$tag" --title "$tag" --notes-file release-notes.md
          else
            gh release create "$tag" "$bundle" "$checksum" \
              --verify-tag \
              --title "$tag" \
              --notes-file release-notes.md
          fi

          created_at="$(
            gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag" \
              --jq '.created_at | sub("\\.[0-9]+Z$"; "") | sub("Z$"; "")'
          )"
          download_url="https://github.com/$GITHUB_REPOSITORY/releases/download/$tag/patches-$version.rvp"
          jq -n \
            --arg version "$tag" \
            --arg created_at "$created_at" \
            --rawfile description release-notes.md \
            --arg download_url "$download_url" \
            '{
              version: $version,
              created_at: $created_at,
              description: $description,
              download_url: $download_url,
              signature_download_url: null
            }' > "$manifest"

          jq -e \
            --arg version "$tag" \
            --arg created_at "$created_at" \
            --arg download_url "$download_url" \
            '.version == $version and
             .created_at == $created_at and
             (.description | type == "string") and
             .download_url == $download_url and
             .signature_download_url == null' \
            "$manifest" >/dev/null

          gh release upload "$tag" "$manifest" --clobber

          expected_assets="$(printf '%s\n' \
            "patches-$version.rvp" \
            "patches-$version.rvp.sha256" \
            'patches.json' | sort)"
          actual_assets="$(
            gh release view "$tag" --json assets --jq '.assets[].name' | sort
          )"
          if [[ "$actual_assets" != "$expected_assets" ]]; then
            echo 'GitHub Release assets do not match the expected set:' >&2
            printf '%s\n' "$actual_assets" >&2
            exit 1
          fi
