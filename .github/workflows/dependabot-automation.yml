name: Dependabot automation

on:
  schedule:
    - cron: "0 9 28 * *"
      timezone: "Asia/Tokyo"
  workflow_dispatch:
    inputs:
      pr_number:
        required: true
        type: string
      head_sha:
        required: true
        type: string
  pull_request_target:
    types: [opened, synchronize, reopened]
  workflow_run:
    workflows: ["CI"]
    types: [completed]

jobs:
  dependabot:
    permissions:
      actions: write
      contents: write
      pull-requests: write
      statuses: write
    uses: roflsunriz/myAGENTS/.github/workflows/dependabot-automation.yml@56a0c64d0d9d3da615bf9f8dd7ae447e00320e59
    with:
      ci_workflows: '["CI"]'
      callback_workflow_file: dependabot-automation.yml
      autofix_command: './gradlew --no-daemon build --write-locks'
      autofix_paths: '["extensions/chmate/gradle.lockfile","patches/gradle.lockfile","settings-gradle.lockfile"]'
      autofix_workflow_files: '["ci.yml"]'
